name: Generate Release Keystore (one-time)

# Run manually from the Actions tab. Fill in the inputs, run it, then
# download the "keystore-output" artifact from the finished run.
# DELETE this workflow file (and the artifact, after you copy the values)
# once you're done — you only need to do this once.

on:
  workflow_dispatch:
    inputs:
      key_alias:
        description: "Key alias (any name you want, e.g. mykey)"
        required: true
        default: "mykey"
      store_password:
        description: "Keystore password (remember this!)"
        required: true
      key_password:
        description: "Key password (can be same as keystore password)"
        required: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias "${{ inputs.key_alias }}" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "${{ inputs.store_password }}" \
            -keypass "${{ inputs.key_password }}" \
            -dname "CN=Nirvana,O=Nirvana,C=IN"

          base64 -w0 release.keystore > keystore_base64.txt

          {
            echo "KEY_ALIAS=${{ inputs.key_alias }}"
            echo "KEYSTORE_PASSWORD=${{ inputs.store_password }}"
            echo "KEY_PASSWORD=${{ inputs.key_password }}"
            echo ""
            echo "--- KEYSTORE (base64) below: copy ALL of this into the KEYSTORE secret ---"
            cat keystore_base64.txt
          } > secrets_summary.txt

      - name: Upload keystore artifact
        uses: actions/upload-artifact@v6
        with:
          name: keystore-output
          path: |
            release.keystore
            keystore_base64.txt
            secrets_summary.txt
          retention-days: 1
